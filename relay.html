<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Loading...</title></head>
<body>
<script>
try {
  var hash = window.location.hash.slice(1);
  if (hash) {
    var decoded = decodeURIComponent(escape(atob(decodeURIComponent(hash))));
    localStorage.setItem('bm_handoff', decoded);
    localStorage.setItem('bm_handoff_ts', Date.now().toString());
  }
} catch(e) {}
window.location.href = './';
</script>
</body>
</html>
